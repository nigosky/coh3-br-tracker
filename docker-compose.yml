services:
  coh3-br-monitor:
    build: .
    container_name: coh3-br-monitor
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: ./.env.secret
        required: false
    volumes:
      - ./config.json:/app/config.json
      - ./data:/app/data
    environment:
      - TZ=America/Sao_Paulo
      - SQLITE_DB_PATH=/app/data/coh3_br_matches.db
