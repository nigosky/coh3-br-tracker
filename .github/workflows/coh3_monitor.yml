name: CoH3 Brasil Monitor (Hardened)

on:
  schedule:
    # Horario ativo no Brasil (12:00-20:59 BRT = 15:00-23:59 UTC): a cada 15 min fora de pico (:07, :22, :37, :52)
    - cron: "7,22,37,52 15-23 * * *"
    # Noite/virada no Brasil (21:00-01:59 BRT = 00:00-04:59 UTC): a cada 15 min fora de pico (:07, :22, :37, :52)
    - cron: "7,22,37,52 0-4 * * *"
    # Madrugada/manha (02:00-11:59 BRT = 05:00-14:59 UTC): 4 checagens/dia (total 60/dia = <= 1.860 min/mes gratis)
    - cron: "37 6,9,12,14 * * *"
  repository_dispatch:
    types: [sync-coh3]
  push:
    branches:
      - main
      - master
    paths:
      - "**.py"
      - "assets/**"
      - "config.json"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      add_custom_player:
        description: "➕ Adicionar jogador extra além dos fixos (cole SteamID64 ou link do coh3stats.com)"
        required: false
        default: ""
        type: string
      remove_custom_player:
        description: "➖ Remover jogador extra adicionado manualmente (SteamID64 ou link coh3stats)"
        required: false
        default: ""
        type: string
      send_initial_test:
        description: "Enviar/atualizar Painel Fixado PT-BR + 1 Card de exemplo agora?"
        required: false
        default: false
        type: boolean
      force_rank_scan:
        description: "Forcar revarredura imediata do Ranking (Top 20 + monitorados) nas leaderboards?"
        required: false
        default: false
        type: boolean
      force_weekly_summary:
        description: "Publicar Card de Resumo Semanal dos Veteranos BR agora?"
        required: false
        default: false
        type: boolean
      reset_discord_channel:
        description: "Limpar mensagens antigas do bot no canal Discord e recomecar do zero?"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: coh3-br-monitor-state
  cancel-in-progress: false

jobs:
  sync-matches:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout seguro na branch ativa (SHA imutavel)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Preparar renderizador grafico seguro (apt oficial assinado GPG, zero pip)
        run: |
          set -euo pipefail
          NEED_PKGS=()
          if ! python3 -c "from PIL import Image, ImageDraw, ImageFont" >/dev/null 2>&1; then
            NEED_PKGS+=("python3-pil")
          fi
          if [ ! -d "/usr/share/fonts/truetype/dejavu" ]; then
            NEED_PKGS+=("fonts-dejavu-core" "fonts-liberation")
          fi
          if [ ! -d "/usr/share/fonts/truetype/roboto" ]; then
            NEED_PKGS+=("fonts-roboto")
          fi
          if [ ! -f "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc" ] && [ -z "$(find /usr/share/fonts -iname '*NotoSansCJK*' -print -quit 2>/dev/null)" ]; then
            NEED_PKGS+=("fonts-noto-cjk")
          fi
          if [ "${#NEED_PKGS[@]}" -gt 0 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends "${NEED_PKGS[@]}"
          fi

      - name: Executar ciclo automatico CoH3 -> Discord (tripla checagem Relic Direta x coh3stats)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ADD_PLAYER: ${{ inputs.add_custom_player }}
          INPUT_REMOVE_PLAYER: ${{ inputs.remove_custom_player }}
          INPUT_SEND_TEST: ${{ inputs.send_initial_test }}
          INPUT_FORCE_RANK: ${{ inputs.force_rank_scan }}
          INPUT_FORCE_WEEKLY: ${{ inputs.force_weekly_summary }}
          INPUT_RESET_DISCORD: ${{ inputs.reset_discord_channel }}
        run: |
          set -euo pipefail

          if [ ! -f "monitor.py" ]; then
            FOUND_FILE="$(find . -maxdepth 2 -name monitor.py -print -quit)"
            if [ -z "${FOUND_FILE}" ]; then
              echo "::error::Arquivos do projeto (monitor.py) nao encontrados no repositorio."
              exit 1
            fi
            cd "$(dirname "${FOUND_FILE}")"
          fi

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "::error::O Secret DISCORD_WEBHOOK_URL ainda nao foi configurado em Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # Valores repassados exclusivamente via argv (zero shell eval / zero injecao de comando)
          if [ -n "${INPUT_ADD_PLAYER:-}" ]; then
            python3 manage.py add-player -- "${INPUT_ADD_PLAYER}"
          fi

          if [ -n "${INPUT_REMOVE_PLAYER:-}" ]; then
            python3 manage.py remove-player -- "${INPUT_REMOVE_PLAYER}"
          fi

          MONITOR_ARGS=(--once --verify-discord)
          if [ "${INPUT_FORCE_RANK:-false}" = "true" ]; then
            MONITOR_ARGS+=(--force-rank-scan)
          fi
          if [ "${INPUT_FORCE_WEEKLY:-false}" = "true" ]; then
            MONITOR_ARGS+=(--force-weekly-summary)
          fi
          if [ "${INPUT_RESET_DISCORD:-false}" = "true" ]; then
            MONITOR_ARGS+=(--reset-discord-channel)
          fi
          python3 monitor.py "${MONITOR_ARGS[@]}"

          if [ "${INPUT_SEND_TEST:-false}" = "true" ]; then
            python3 manage.py test-discord
          fi

      - name: Auditoria anti-vazamento e persistencia automatica de estado
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ ! -f "monitor.py" ]; then
            FOUND_FILE="$(find . -maxdepth 2 -name monitor.py -print -quit)"
            if [ -n "${FOUND_FILE}" ]; then
              cd "$(dirname "${FOUND_FILE}")"
            fi
          fi

          # Bloqueia qualquer URL de Webhook (incluindo ptb/canary e caixa alta/baixa) em arquivos rastreados
          if grep -RInEi "(ptb\.|canary\.)?discord(app)?\.com/api/(v[0-9]+/)?webhooks/[0-9]+" config.json *.csv *.json *.py 2>/dev/null; then
            echo "::error::Bloqueio de seguranca acionado: padrao de URL de Webhook detectado em arquivo rastreado!"
            exit 1
          fi

          STATE_FILES=(coh3_br_matches.db config.json top20_br_por_modo.csv top20_br_por_modo.json jogadores_br_steam.csv jogadores_br_steam.json)
          for state_file in "${STATE_FILES[@]}"; do
            if [ -f "${state_file}" ]; then
              git add -- "${state_file}"
            fi
          done

          if git diff --cached --name-only | grep -Ei "(^\.env|\.secret$)" >/dev/null 2>&1; then
            echo "::error::Bloqueio critico: tentativa de indexar arquivo de segredo detectada!"
            git reset --quiet
            exit 1
          fi

          UTC_NOW="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          BRT_NOW="$(TZ='America/Sao_Paulo' date '+%Y-%m-%d %H:%M:%S BRT')"
          STATE_STATUS="Sem alteracoes novas neste ciclo"

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao de estado neste ciclo; nenhum commit necessario."
          else
            BRANCH_NAME="${TARGET_BRANCH:-main}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(state): atualizar catalogo e ranking CoH3 BR [skip ci]"

            PUSHED=false
            for attempt in 1 2 3; do
              if ! git pull --rebase -X theirs origin "${BRANCH_NAME}"; then
                for sf in "${STATE_FILES[@]}"; do
                  [ -f "${sf}" ] && git checkout --theirs -- "${sf}" 2>/dev/null || true
                  [ -f "${sf}" ] && git add -- "${sf}" 2>/dev/null || true
                done
                GIT_EDITOR=true git rebase --continue || git rebase --abort || true
              fi
              if git push origin "HEAD:${BRANCH_NAME}"; then
                echo "Estado persistido com sucesso na branch ${BRANCH_NAME}."
                STATE_STATUS="Estado atualizado e salvo em \`${BRANCH_NAME}\`"
                PUSHED=true
                break
              fi
              sleep 2
            done

            if [ "${PUSHED}" != "true" ]; then
              echo "::error::Falha ao enviar estado atualizado para origin/${BRANCH_NAME} apos 3 tentativas."
              exit 1
            fi
          fi

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### CoH3 Brasil Monitor — Resumo da Execução"
              echo "- **Gatilho:** \`${EVENT_NAME:-unknown}\`"
              echo "- **Horário (BRT):** ${BRT_NOW} (${UTC_NOW})"
              echo "- **Auditoria:** Tripla checagem ativa (Relic Direta × coh3stats.com × Discord)"
              echo "- **Persistência:** ${STATE_STATUS}"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
