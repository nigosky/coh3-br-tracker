name: CoH3 Brasil Monitor (Hardened)
on:
  schedule:
    # Horario ativo no Brasil (11:00 as 02:00 BRT = 14:00-23:59 e 00:00-04:59 UTC): roda a cada 15 minutos fora de pico!
    - cron: "4,19,34,49 0-4,14-23 * * *"
    # Madrugada/manha (02:00 as 11:00 BRT): roda a cada 2h, mantendo < 2.000 min/mes gratis em Repositorio Privado
    - cron: "34 5-13/2 * * *"
  push:
    branches:
      - main
      - master
    paths:
      - "**.py"
      - "config.json"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      add_custom_player:
        description: "➕ Adicionar jogador extra além dos 31 (cole SteamID64 ou link do coh3stats.com)"
        required: false
        default: ""
        type: string
      remove_custom_player:
        description: "➖ Remover jogador extra adicionado manualmente (SteamID64 ou link coh3stats)"
        required: false
        default: ""
        type: string
      send_initial_test:
        description: "Enviar/atualizar Painel Fixado PT-BR + 1 Card de exemplo agora?"
        required: false
        default: false
        type: boolean
      force_rank_scan:
        description: "Forcar revarredura imediata do Ranking (Top 20 + monitorados) nas leaderboards?"
        required: false
        default: false
        type: boolean
permissions: {}
concurrency:
  group: coh3-br-monitor-state
  cancel-in-progress: false
jobs:
  sync-matches:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout seguro na branch ativa (SHA imutavel)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Preparar renderizador grafico leve (Pillow + fontes PT-BR)
        run: |
          set -euo pipefail
          if ! python3 -c "from PIL import Image, ImageDraw, ImageFont" >/dev/null 2>&1; then
            python3 -m pip install --quiet --disable-pip-version-check Pillow || {
              sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends python3-pil
            }
          fi
          if [ ! -d "/usr/share/fonts/truetype/dejavu" ]; then
            sudo apt-get update -qq || true
